name: Publish to npm

on:
    release:
        types: [published]
    workflow_dispatch:

jobs:
    publish:
        name: Build & Publish
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24.x'
                  registry-url: 'https://registry.npmjs.org'
                  cache: 'npm'

            - name: Install dependencies (clean install)
              run: npm ci

            - name: Verify version matches the release tag (if triggered by release)
              if: github.event_name == 'release'
              run: |
                  PACKAGE_VERSION=$(node -p "require('./package.json').version")
                  if [ "$PACKAGE_VERSION" != "$GITHUB_REF_NAME" ]; then
                    echo "❌ Package version ($PACKAGE_VERSION) does not match release tag ($GITHUB_REF_NAME)"
                    exit 1
                  fi
                  echo "✅ Package version $PACKAGE_VERSION matches release tag $GITHUB_REF_NAME"

            - name: Run Stylelint (CSS linting)
              run: npm run lint

            - name: Check Prettier formatting
              run: npm run format -- --check

            - name: Build package
              run: npm run build

            - name: Publish to npm with provenance
              run: npm publish --provenance --access public
